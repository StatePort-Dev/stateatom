name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned test applications
        run: npm run prepare:short-loop
      - run: npm run build
      - run: npm test
      - run: npm run check:ui
  packed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build immutable Atom and UI pair with a cold consumer cache
        env:
          npm_config_cache: ${{ runner.temp }}/atom-consumer-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run pack:atom
      - name: Select this job's immutable candidate
        id: candidate
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, appendFileSync} from 'node:fs';
          import {dirname, join, relative} from 'node:path';
          const latest = JSON.parse(readFileSync('.artifacts/atom/atom-handoff.json', 'utf8'));
          assert.equal(latest.sourceRevision, process.env.GITHUB_SHA);
          assert.equal(latest.sourceDirty, false);
          const handoff = relative(process.cwd(), join(dirname(latest.package.file), 'atom-handoff.json'));
          assert.match(handoff, /^\.artifacts\/atom\/[\dTZ-]+\/atom-handoff\.json$/);
          assert.deepEqual(JSON.parse(readFileSync(handoff, 'utf8')), latest);
          appendFileSync(process.env.GITHUB_OUTPUT, 'handoff=' + handoff + '\n');
          console.log(handoff);
          JS
      - name: Compile packed public declarations
        env:
          ATOM_HANDOFF: ${{ steps.candidate.outputs.handoff }}
        run: npm run verify:atom-types -- "$ATOM_HANDOFF"
      - name: Verify exact installed pair, exports and peers
        env:
          ATOM_HANDOFF: ${{ steps.candidate.outputs.handoff }}
        run: npm run verify:atom-package -- "$ATOM_HANDOFF"
      - name: Install locked Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Permit the locked Chromium sandbox on the ephemeral Ubuntu runner
        shell: bash
        run: |
          if [[ ! -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] ||
             [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns) != 1 ]]; then
            echo 'No AppArmor user-namespace exception needed'
            exit 0
          fi
          chromium_path=$(node --input-type=module -e "import {chromium} from 'playwright'; import {realpathSync} from 'node:fs'; console.log(realpathSync(chromium.executablePath()))")
          # A literal executable path, without AppArmor glob or policy syntax.
          [[ "$chromium_path" =~ ^/[a-zA-Z0-9_./-]+/chrome$ ]]
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile stateatom-ci-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$chromium_path" | sudo tee /etc/apparmor.d/stateatom-ci-chromium
          sudo apparmor_parser -r /etc/apparmor.d/stateatom-ci-chromium
      - name: Verify native browser candidate sequentially
        env:
          ATOM_HANDOFF: ${{ steps.candidate.outputs.handoff }}
        run: node scripts/verify-native-candidate.mjs "$ATOM_HANDOFF"
      - name: Report synthetic browser startup diagnostics
        if: ${{ failure() }}
        run: |
          node --input-type=module <<'JS'
          import {readFile, readdir} from 'node:fs/promises';
          for (const base of ['.artifacts/v01/basic-reader', '.artifacts/l01/maps-native']) {
            const runs = await readdir(base).catch(error => { if (error.code === 'ENOENT') return []; throw error; });
            for (const run of runs.filter(name => /^[0-9TZ-]+$/.test(name))) {
              for (const host of ['standalone', 'embedding', 'standalone-fresh-reader', 'embedding-fresh-reader']) {
                const file = base + '/' + run + '/profiles/' + host + '/chrome.log';
                const log = await readFile(file, 'utf8').catch(error => { if (error.code === 'ENOENT') return null; throw error; });
                if (log !== null) console.log(file + '\n' + log.slice(-12000));
              }
            }
          }
          JS
      - name: Retain allowlisted synthetic native results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: atom-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .artifacts/v01/native-candidate/*/results.json
            .artifacts/v01/native-candidate/*/preregistration.json
            .artifacts/v01/native-candidate/*/*.log
            .artifacts/v01/basic-reader/*/results.json
            .artifacts/l01/maps-native/*/results.json
            !**/profiles/**
