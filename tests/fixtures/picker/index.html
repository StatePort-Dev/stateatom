<!doctype html><meta charset="utf-8"><title>U05 visual picker controls</title><style>body{font:16px system-ui;margin:28px}button,a{display:inline-block;padding:16px;margin:8px}#tiny{display:inline-block;width:7px;height:7px;background:#777}#rows{display:flex}iframe{width:300px;height:90px}#space{height:700px}</style><h1>Visual selection controls</h1><p><output id="action-counts">App clicks: 0 · submits: 0</output></p><form><div id="container"><button id="confirm" type="submit"><span>Confirm nested target</span></button><button id="disabled" disabled>Disabled target</button><a id="link" href="/navigated">Navigation link</a></div></form><section id="rows"><button class="row"><span>Same row</span></button><button class="row"><span>Same row</span></button></section><p><span id="tiny" aria-label="Small target"></span></p><button id="moving">Moving target</button><button id="replace">Replaceable target</button><open-control id="open-root"></open-control><closed-control id="closed-root"></closed-control><iframe src="/frame"></iframe><div id="space"></div><script>
window.calls={};for(const type of ['pointerdown','pointerup','mousedown','mouseup','click','keydown','keyup'])for(const capture of [true,false])window.addEventListener(type,e=>{const k=type+':'+capture;calls[k]=(calls[k]||0)+1},capture);window.actions={submit:0,click:0};function showCounts(){document.querySelector('#action-counts').textContent='App clicks: '+actions.click+' · submits: '+actions.submit;}document.querySelector('form').addEventListener('submit',e=>{actions.submit++;showCounts();e.preventDefault()});document.querySelector('#confirm').addEventListener('click',()=>{actions.click++;showCounts();});document.querySelector('#open-root').attachShadow({mode:'open'}).innerHTML='<button id="inner"><span id="leaf">Open shadow target</span></button>';document.querySelector('#closed-root').attachShadow({mode:'closed'}).innerHTML='<button>Closed shadow target</button>';
</script>
