<!doctype html>

<meta charset="utf-8">
<title>Synthetic development action boundary controls</title>
<style>button,section{display:block;margin:8px;padding:8px}pre{white-space:pre-wrap}</style>
<button id="direct"><span id="direct-child">Direct</span></button>
<section id="capture"><button id="capture-child">Capture and bubble</button></section>
<section id="delegated"><button id="delegated-child">Delegated</button></section>
<button id="arrow">Arrow</button><button id="bound">Bound receiver</button>
<button id="disabled" disabled>Disabled</button>
<button id="factory-a">Closure A</button><button id="factory-b">Closure B</button>
<button id="replace-target">Old listener</button><button id="replace-handler">Replace node/listener</button>
<button id="throwing">Throw original</button><button id="finally">Return with finally</button>
<button id="finally-throw">Return overridden by finally throw</button>
<button id="async">Async continuation</button><button id="unrelated">Queued work</button>
<pre id="output"></pre>
<button id="promise-return">Return original Promise</button><button id="proxy">Proxy argument gap</button>
<button id="stopped">Stop propagation</button><button id="before-capture">Stop before observer</button><button id="reuse">Later reuse gap</button>
<section id="trace-controls"></section><pre id="trace"></pre><pre id="trace-status"></pre>
<script type="module" src="/controller.mjs"></script>
