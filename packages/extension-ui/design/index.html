function instrumentSettings(p){return `<div class="setting-section"><h3>Discovery</h3>${settingRow('Application event handlers','click · change · submit',xtoggle('instrument.handlers',p.instrument.handlers,'Discover application handlers'))}${settingRow('Native / delegated listeners','Show registration target and event phase',xtoggle('instrument.native',p.instrument.native,'Include native listeners'))}${settingRow('Component hooks','Component scope · not DOM ownership',xtoggle('instrument.hooks',p.instrument.hooks,'Show component hooks'))}</div><div class="setting-section"><h3>Runtime observation</h3>${settingRow('Recording scope','Explicit start · no automatic callback execution',`<select data-setting="instrument.mode" aria-label="Runtime observation scope"><option value="selected" ${p.instrument.mode==='selected'?'selected':''}>Selected interaction</option><option value="off" ${p.instrument.mode==='off'?'selected':''}>Off</option></select>`)}${settingRow('Capture argument / result values','Off by default · redacted before export',xtoggle('instrument.values',p.instrument.values,'Capture argument values'))}${xrow('Coverage','Since attachment · may be partial')}${xrow('Function replacement','Not enabled')}</div><div class="setting-section"><h3>Evidence</h3><div class="evidence-legend">${xt('Code-linked','blue')}<span>Possible path in source</span>${xt('Observed','green')}<span>Recorded execution in this run</span>${xt('Unknown','outline')}<span>No supported observation</span></div></div>`}
function connectionSettings(){return `<div class="setting-section"><div class="row between"><h3>StatePort Desktop</h3>${xt(ext.connection==='connected'?'Chrome connected':ext.connection==='ready'?'Ready for Chrome':'Offline',ext.connection==='connected'?'green':'outline')}</div>${xrow('Native bridge',ext.connection==='offline'?'Unavailable':'Registered on this device')}${xrow('Capture',ext.connection==='connected'?'Available':'Open Desktop to connect')}<div class="row" style="margin-top:15px">${xb('Retry','retry','secondary','reset')}${xb(ext.connection==='offline'?'Setup help':'Disconnect','connection-toggle','secondary','monitor')}</div><details class="trace-details"><summary>Setup / repair ${I('chevron')}</summary><div class="small muted">Desktop → Settings → Capture from Chrome. Setup and repair remain in Desktop.</div></details></div><div class="setting-section"><div class="row between"><h3>IDE companion</h3>${xt(s.linked?'Linked':'Not connected',s.linked?'blue':'outline')}</div>${xrow('Workspace',s.linked?'meridian-web':'None')}${xrow('Access','Read source references only')}<div class="row" style="margin-top:15px">${xb(s.linked?'Disconnect IDE':'Connect demo IDE','ide-toggle','secondary','link')}</div></div><div class="setting-section"><h3>Independent capabilities</h3>${xrow('Atom inspection','No Desktop required')}${xrow('Source maps','No IDE required')}${xrow('Capture / Review / Save','Desktop required')}</div>`}
function domainSettings(){return `<div class="domain-table">${ext.profiles.map(p=>`<button class="domain-profile" data-action="x:domain:${esc(p.origin)}"><div class="row">${I('globe')}<div><strong>${esc(p.origin)}</strong><span>${p.capture.origins.length} extra API origins · ${p.maps.mode==='auto'?'Automatic maps':p.maps.mode==='local'?'Local maps':'Internal source maps'}</span></div></div><div class="row">${xt(p.env,p.env==='production'?'amber':'outline')}${I('chevron')}</div></button>`).join('')}</div><div class="setting-section"><h3>Add domain</h3><div class="field-with-action"><input id="new-origin" placeholder="https://staging.example.com" aria-label="New domain origin">${xb('Add domain','add-domain','primary','globe')}</div><div class="tiny muted">Scheme and port are part of the profile. No wildcard inheritance.</div></div>`}
function openXDialog(kind){exui.dialog=kind;const d=$('#dialog');d.className='';let title='',body='',foot='';if(kind==='localai'){title='Explain simply';body='<div class="tiny muted">Template preview · not model output</div><div class="scope-mini">'+xrow('Selection','ConfirmButton')+xrow('Handler','handleConfirm')+xrow('Observed calls',String(ext.action.calls.length))+'</div><div class="tiny muted">Derived wording never changes evidence status.</div>';foot=xb('Close','dialog-cancel','primary')}else if(kind==='start'){title='Start Capture & Reload';body=`<div class="scope-mini">${xrow('Tab',esc(lp().origin))}${xrow('Reload','After capture is ready')}${xrow('Unsaved work','Save it before starting')}</div>`;foot=xb('Cancel','dialog-cancel')+xb('Start & reload','start-confirm','primary','capture')}else if(kind==='discard'){title='Discard this capture?';body='<div class="small muted">The draft is removed. The browser session stays open.</div>';foot=xb('Keep capture','dialog-cancel')+xb('Discard draft','discard-confirm','danger')}else if(kind==='review'){title='Desktop Review';body=`<div class="tiny muted">Simulated Desktop handoff</div><div class="review-draft-title"><h3>Order #731 · Confirm unavailable</h3>${xt(ext.capture.partial?'Partial capture':'Captured',ext.capture.partial?'amber':'blue')}</div>${xrow('Requests / checkpoints',ext.capture.requests+' / '+ext.capture.checkpoints)}${xrow('Protected fields','Excluded before persistence')}<div class="section-label" style="margin-top:20px">Browser sign-in</div><label class="review-choice"><input type="radio" name="signin" value="exclude" ${ext.capture.auth==='exclude'?'checked':''}><div><strong>Exclude browser sign-in</strong><span>Credential-free Card · no local binding</span></div></label><label class="review-choice"><input type="radio" name="signin" value="keep" ${ext.capture.auth==='keep'?'checked':''}><div><strong>Keep on this device</strong><span>OS credential store · exact original application</span></div></label><div class="tiny muted">Sharing and reproduction verification are separate.</div>`;foot=xb('Back','dialog-cancel')+xb('Simulate Desktop save','save-receipt','primary','capture',ext.capture.auth?'':'disabled')}else if(kind==='source'){title='handleConfirm';body='<div class="row">'+xt('Code-linked','blue')+'<code>OrderActions.tsx:48</code></div><pre class="code-file">48 async function handleConfirm() {\n49   await confirmOrder(orderId);\n50   setStatus("confirmed");\n51 }</pre><div class="tiny muted">Demo source · inspection does not execute the function</div>';foot=xb('Close','dialog-cancel','primary')}else{title='Saved in Desktop';body=`${xrow('Card','card_demo_731')}${xrow('Reproduction','Not verified')}<div class="tiny muted">UX simulation · no real Card was saved</div>`;foot=xb('Close','dialog-cancel','primary')};d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${xi('close','dialog-cancel','Close dialog')}</div><div class="dialog-body">${body}</div><div class="dialog-footer">${foot}</div>`;if(!d.open)d.showModal()}
let persistence=true;function storeSettings(){try{localStorage.setItem('stateport-ux-v3-profiles',JSON.stringify(ext.profiles));persistence=true}catch{persistence=false}}
function readDraft(){const p=exui.draft;if($('#api-origins'))p.capture.origins=X.origins($('#api-origins').value);if($('#map-url')){let u=new URL($('#map-url').value);if(u.protocol!=='https:'||u.username||u.password)throw Error('Use a credential-free HTTPS URL');if(p.maps.url!==u.href){p.maps.granted=false;p.maps.status='Not checked'}p.maps.url=u.href}}
function checkMaps(){let p=exui.draft;exui.error='';readDraft();if(p.maps.mode==='internal'&&!p.maps.granted)throw Error('Allow the map server origin first');if(p.maps.mode==='local'&&!p.maps.file)throw Error('Choose a local source map or release ZIP');p.maps.status=X.identity({hash:'r7-asset'},exui.mapFixture==='unverified'?{}:{hash:exui.mapFixture==='mismatch'?'r6-asset':'r7-asset'});p.maps.capability=p.maps.status==='Build mismatch'?'Not applied':exui.mapFixture==='positions'?'Positions only':'Source available';exui.saved=false;render()}
async function startCapture(reload){if(E.active(s)||E.stale(s))throw Error('Restore Atom overrides first');X.start(ext,reload,false);render();setTimeout(()=>{X.ready(ext);render()},450)}
// Consume only v3 actions in capture phase so the original Atom event handlers remain unchanged.
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');const a=el?.dataset.action;if(!a?.startsWith('x:')||el.disabled)return;e.stopImmediatePropagation();const cmd=a.slice(2);try{if(cmd.startsWith('surface:')){let k=cmd.slice(8);if(k==='settings'){openSettings();return}exui.settings=false;exui.surface=k==='capture'?'capture':'atom';if(k==='actions')ui.tab='actions';else if(k==='atom')ui.tab='inputs';ui.panel=true;render()}else if(cmd==='settings'||cmd.startsWith('settings:'))openSettings(cmd.split(':')[1]);else if(cmd.startsWith('settings-tab:')){readDraft();exui.settingsTab=cmd.slice(13);exui.error='';render()}else if(cmd==='settings-close'){exui.settings=false;render()}else if(cmd==='settings-save'){readDraft();ext.profiles=ext.profiles.map(p=>p.origin===exui.draft.origin?X.clone(exui.draft):p);storeSettings();exui.saved=true;exui.error='';render()}else if(cmd==='settings-discard'){exui.draft=X.clone(xp());exui.saved=false;exui.error='';render()}else if(cmd.startsWith('domain:')){ext.selected=cmd.slice(7);openSettings('maps')}else if(cmd==='add-domain'){let o=X.origin($('#new-origin').value);if(ext.profiles.some(p=>p.origin===o))throw Error('Domain already exists');ext.profiles.push(X.profile(o));storeSettings();render()}else if(cmd.startsWith('map-mode:')){readDraft();exui.draft.maps.mode=cmd.slice(9);exui.draft.maps.status='Not checked';exui.saved=false;render()}else if(cmd==='grant-map'){readDraft();exui.draft.maps.granted=true;exui.error='';render()}else if(cmd==='revoke-map'){exui.draft.maps.granted=false;exui.draft.maps.status='Not checked';render()}else if(cmd==='map-check'){checkMaps()}else if(cmd==='clear-maps'){exui.draft.maps.status='Not checked';exui.draft.maps.capability='Not available';exui.draft.maps.file='';exui.saved=false;render()}else if(cmd==='connection-toggle'){if(['recording','preparing'].includes(ext.capture.phase))throw Error('Stop Capture before disconnecting');ext.connection=ext.connection==='offline'?'ready':'offline';render()}else if(cmd==='retry'){ext.connection='connected';render()}else if(cmd==='ide-toggle'){s.linked=!s.linked;render()}else if(cmd==='start'){if(lp().capture.reload)openXDialog('start');else await startCapture(false)}else if(cmd==='start-other'){if(!lp().capture.reload)openXDialog('start');else await startCapture(false)}else if(cmd==='start-confirm'){closeDialog();exui.dialog=null;await startCapture(true)}else if(cmd==='stop'){X.stop(ext);render()}else if(cmd==='discard')openXDialog('discard');else if(cmd==='discard-confirm'){X.discard(ext);closeDialog();exui.dialog=null;render()}else if(cmd==='new-capture'){X.discard(ext);render()}else if(cmd==='desktop-review')openXDialog('review');else if(cmd==='save-receipt'){X.receipt(ext);closeDialog();exui.dialog=null;render()}else if(cmd==='desktop-saved')openXDialog('saved');else if(cmd==='interrupt'){X.interrupt(ext);render()}else if(cmd==='actions'){ui.tab='actions';render()}else if(cmd.startsWith('action-tab:')){exui.actionTab=cmd.slice(11);render()}else if(cmd.startsWith('handler:')){exui.handler=cmd.slice(8);render()}else if(cmd==='explain-local')openXDialog('localai');else if(cmd==='ai-download'){localExplanation.status='downloading';render();setTimeout(()=>{localExplanation.status='available';render()},500)}else if(cmd==='handler-source'){if(s.linked||(lp().maps.status==='Exact match'&&lp().maps.capability==='Source available'))openXDialog('source');else openSettings('maps')}else if(cmd==='observe'){if(lp().instrument.mode==='off')throw Error('Observation is disabled for this domain');X.observe(ext);exui.actionTab='calls';render()}else if(cmd==='stop-observe'){X.unobserve(ext);render()}else if(cmd==='demo-event'){if(ext.capture.phase==='recording'){X.activity(ext);render()}else if(ext.action.observing){if(!X.event(ext,E.output(s).disabled,lp().instrument.values))toast('Confirm is disabled · no click observed');else render()}else toast('Start Capture or Observe next event first')}else if(cmd==='dialog-cancel'){closeDialog();exui.dialog=null}else if(cmd==='reset-all'){ext=X.create();exui.surface='atom';exui.settings=false;exui.dialog=null;baseReset('hold')}}catch(err){if(exui.settings){exui.error=err.message;render()}else toast(err.message)}},true);
document.addEventListener('change',e=>{let el=e.target;try{if(el.id==='local-ai-enabled'){localExplanation.enabled=el.checked;return}if(el.id==='local-ai-state'){localExplanation.status=el.value;if(el.value!=='available')localExplanation.enabled=false;render();return}if(el.dataset.setting){const [g,k]=el.dataset.setting.split('.');exui.draft[g][k]=el.type==='checkbox'?el.checked:el.value;exui.saved=false;return}if(el.id==='settings-origin'){ext.selected=el.value;exui.draft=X.clone(xp());exui.error='';exui.saved=false;render()}if(el.id==='map-fixture'){exui.mapFixture=el.value;exui.draft.maps.status='Not checked';render()}if(el.id==='map-file'){const f=el.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('Demo import limit: 20 MiB');exui.draft.maps.file=f.name;exui.draft.maps.status='Not checked';exui.draft.maps.capability='Not available';render()}if(el.name==='signin'){ext.capture.auth=el.value;openXDialog('review')}}catch(err){exui.error=err.message;render()}},true);
document.addEventListener('click',e=>{if(e.target.closest('[data-action="demo-confirm"]')&&ext.action.observing){X.event(ext,E.output(s).disabled,lp().instrument.values);render()}});
window.StatePortV3={state:()=>X.clone(ext),ui:()=>X.clone(exui),show(k){exui.settings=false;if(k==='settings'){openSettings();return}exui.surface=k==='capture'?'capture':'atom';if(['handlers','hooks','calls'].includes(k)){ui.tab='actions';exui.actionTab=k}ui.panel=true;render()},loadCapture(phase){ext.capture={...ext.capture,phase,requests:18,actions:4,checkpoints:3,bytes:256};exui.surface='capture';exui.settings=false;render()},loadSettings(k){openSettings(k)}};
let entry=new URLSearchParams(location.search).get('view');if(entry==='settings')openSettings('maps');else{exui.surface=entry==='capture'?'capture':'atom';if(entry==='actions'){ui.tab='actions'}render()}

document.addEventListener('input',e=>{if(e.target.id==='api-origins'||e.target.id==='map-url')exui.saved=false});
</script></body></html>
